<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind</title>
  <style>
    /* 使 body 元素充满整个视口 */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      /* 使用 Flexbox 布局将内容垂直和水平居中 */
      display: flex;
      justify-content: center;
      align-items: center;
      /* 设置字体大小，这里设置为 24px 可根据需求调整 */
      font-size: 26px;
    }

    /* 可选：设置容器的最大宽度和内边距，使内容更美观 */
    .container {
      max-width: 800px;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <p>网址都打错了，或许你需要一个眼镜</p>
  </div>
</body>

</html>
